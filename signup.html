<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ExpenseTracker</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<header class="auth-header">
    <a href="index.html" class="auth-logo">
        <span class="leaf-logo"></span>
        <span>Expense<span>Tracker</span></span>
    </a>
    <div class="auth-header-action">
        <span>Already have an account?</span>
        <a href="login.html" class="outline-btn">Login</a>
    </div>
</header>

<main class="auth-main">
    <section class="login-card signup-card">
        <div class="login-promo">
            <div class="promo-content">
                <h1>Build a better<br><span>financial future</span></h1>
                <p>Create your ExpenseTracker account and start managing your money in one place.</p>
                <div class="finance-visual"></div>
            </div>
        </div>

        <div class="login-panel">
            <div class="login-inner">
                <h2>Create account</h2>
                <p class="login-subtitle">Start tracking your money today.</p>

                <form id="signupForm" novalidate>
                    <div class="field-group">
                        <label for="signupName">Full name</label>
                        <div class="input-wrap">
                            <span class="input-icon">◉</span>
                            <input id="signupName" type="text" placeholder="Enter your full name">
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="signupEmail">Email</label>
                        <div class="input-wrap">
                            <span class="input-icon">✉</span>
                            <input id="signupEmail" type="email" placeholder="Enter your email address">
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="signupPassword">Password</label>
                        <div class="input-wrap">
                            <span class="input-icon">▣</span>
                            <input id="signupPassword" type="password" placeholder="Create a password">
                        </div>
                    </div>

                    <label class="remember-label" style="margin-bottom:24px;">
                        <input id="signupRemember" type="checkbox" checked>
                        <span class="custom-check">✓</span>
                        <span>Remember me</span>
                    </label>

                    <button class="login-submit" type="submit">
                        <span>Create account</span>
                        <strong>→</strong>
                    </button>

                    <p class="login-status" id="signupStatus"></p>
                </form>
            </div>
        </div>
    </section>
</main>

<script src="js/auth.js"></script>
<script>
    document.getElementById("signupForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("signupPassword").value;
        const status = document.getElementById("signupStatus");

        if (!name || !email || password.length < 6) {
            status.textContent = "Enter your name, a valid email and a password of at least 6 characters.";
            return;
        }

        window.ExpenseTrackerAuth.saveAuthentication(
            { name: name, email: email },
            document.getElementById("signupRemember").checked
        );

        window.location.replace("dashboard.html");
    });
</script>
</body>
</html>
